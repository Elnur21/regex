<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regex Tasks</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --border: #e3e6ec;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --code-bg: #f3f4f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b;
        --panel: #1c1f26;
        --text: #e6e8ee;
        --muted: #9aa1ae;
        --border: #2c313b;
        --accent: #8b85ff;
        --accent-soft: #262a40;
        --code-bg: #232731;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding: 20px 24px 0;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0 0 16px; color: var(--muted); }
    .tabs { display: flex; gap: 8px; }
    .tab {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    main {
      max-width: 1100px;
      margin: 16px auto 40px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      align-items: start;
    }
    nav {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      position: sticky;
      top: 16px;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      color: var(--text);
      font: inherit;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    nav button:hover { background: var(--code-bg); }
    nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    nav .num { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      min-width: 0;
    }
    section h2 { margin: 0 0 4px; font-size: 19px; }
    .file { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .desc { white-space: pre-line; margin: 0 0 12px; }
    .note { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
    code, pre, textarea { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 13.5px; }
    .pattern {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      word-break: break-all;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin: 0;
      overflow-x: auto;
      white-space: pre;
    }
    pre.output { white-space: pre-wrap; word-break: break-word; min-height: 44px; }
    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .hint { color: var(--muted); font-size: 12px; font-weight: normal; text-transform: none; letter-spacing: 0; }
    .actions { margin-top: 8px; }
    .actions button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    @media (max-width: 760px) {
      header, main { padding: 0 16px; }
      header { padding-top: 16px; }
      main { grid-template-columns: 1fr; }
      nav { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Regex Tasks &amp; Cases</h1>
    <p>Week 2 homework tasks and case studies, with the Python solutions and a live tester.</p>
    <div class="tabs">
      <button class="tab active" data-group="tasks">Tasks</button>
      <button class="tab" data-group="cases">Cases</button>
    </div>
  </header>

  <main>
    <nav id="list"></nav>
    <section id="detail"></section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
